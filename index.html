<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقات النشاط الطلابي</title>
<link rel="icon" href="assets/nassiq-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- الخط: غيّره هنا وفي THEME.font داخل js/config.js -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap bar-in">
    <div class="brand"><img id="brandLogo" alt=""><div><strong id="siteTitle"></strong><span id="schoolName"></span></div></div>
  </div>
</header>

<main class="wrap">
  <!-- الصفحة الرئيسية -->
  <section id="home">
    <div class="hero"><h1>بطاقات النشاط الطلابي</h1><p id="heroSub"></p></div>
    <div class="draft" id="draftBox" hidden><span>لديك بطاقة غير مكتملة من آخر جلسة.</span><button class="btn sm" id="btnDraft">متابعة العمل</button></div>
    <div class="type-grid" id="typeGrid"></div>
    <section class="saved">
      <h2>البطاقات المحفوظة <small id="savedCount"></small></h2>
      <p class="empty" id="savedEmpty">لا توجد بطاقات محفوظة بعد. ستظهر هنا البطاقات التي تحفظها أو تحمّلها.</p>
      <ul id="savedList"></ul>
    </section>
  </section>

  <!-- صفحة إنشاء البطاقة -->
  <section id="editor" hidden>
    <div class="ed-head"><button class="btn sm ghost" id="btnHome">→ العودة للرئيسية</button><h1 id="edTitle"></h1></div>
    <div class="split">
      <div class="panel form-panel"><form id="form" onsubmit="return false" novalidate></form></div>
      <aside class="preview-panel">
        <div class="tools">
          <button class="btn primary" id="btnDownload">تحميل PNG</button>
          <button class="btn" id="btnPrint">طباعة</button>
          <button class="btn" id="btnPdf">تحميل PDF</button>
          <button class="btn" id="btnCopy">نسخ كصورة</button>
          <button class="btn" id="btnSave">حفظ البطاقة</button>
          <button class="btn" id="btnEdit">تعديل البطاقة</button>
          <button class="btn danger" id="btnClear">مسح البيانات</button>
          <button class="btn ghost zoom" id="zoomBtn" type="button">تكبير المعاينة</button>
        </div>
        <div class="frame" id="frame"><div id="cardMount" class="mount"></div></div>
      </aside>
    </div>
  </section>
</main>

<footer class="foot">© <span id="yr"></span> — جميع الحقوق محفوظة</footer>

<div id="toasts" aria-live="polite"></div>
<div id="busy"><div class="spin"></div><p id="busyMsg"></p></div>
<dialog id="dlg"><p id="dlgMsg"></p><div><button class="btn" id="dlgCancel">إلغاء</button><button class="btn primary" id="dlgOk">تأكيد</button></div></dialog>
<div id="printRoot"></div>

<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/card-types.js"></script>
<script src="js/app.js"></script>
</body>
</html>
