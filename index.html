<style>/* =====================================================================
   الألوان والخط تُضبط من THEME في js/config.js (القيم هنا احتياطية)
   ===================================================================== */
:root{--primary:#218a8d;--ink:#083f52;--soft:#a0c2c4;--tint:#eef6f6;--bg:#f6f9fa;--line:#d9e5e8;--font:'IBM Plex Sans Arabic',sans-serif;--r:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:#24353d;font-family:var(--font);font-size:15px;line-height:1.7}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
button,input,select,textarea{font:inherit;color:inherit}

/* الشريط العلوي */
.topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:44px;width:auto}
.brand strong{display:block;color:var(--ink);font-size:19px;line-height:1.3;letter-spacing:.2px}
.brand span{font-size:12.5px;color:#6b8088}
.top-acts{display:flex;gap:8px;flex-wrap:wrap}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger:hover{border-color:#c0392b;color:#c0392b}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 14px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* الرئيسية */
.hero{text-align:center;padding:56px 0 34px}
.hero h1{margin:0 0 8px;color:var(--ink);font-size:34px;line-height:1.3}
.hero p{margin:0;color:#5f747c;font-size:17px}
.draft{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--tint);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;margin:0 auto 22px;max-width:760px}
.type-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1000px;margin:0 auto}
.type-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 1px 2px rgba(8,63,82,.04);display:flex;flex-direction:column;align-items:flex-start;gap:6px;transition:.2s}
.type-card:hover{box-shadow:0 10px 28px rgba(8,63,82,.09);transform:translateY(-2px)}
.type-card .ico{width:52px;height:52px;border-radius:14px;background:var(--tint);color:var(--primary);display:grid;place-items:center;margin-bottom:10px}
.type-card h3{margin:0;color:var(--ink);font-size:19px}
.type-card p{margin:0 0 14px;color:#62777f;font-size:14px;flex:1}
.saved{max-width:760px;margin:48px auto 60px}
.saved h2{font-size:19px;color:var(--ink);margin:0 0 12px}
.saved h2 small{color:#7a8f96;font-weight:400}
.saved ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:#7a8f96;margin:0}
.saved-item{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.saved-item .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.saved-item strong{color:var(--ink);overflow-wrap:anywhere}
.saved-item .sub{font-size:13px;color:#7a8f96}
.tag{align-self:flex-start;background:var(--tint);color:var(--primary);font-size:12px;padding:1px 10px;border-radius:99px;font-weight:600}
.acts{display:flex;gap:6px;flex-shrink:0}

/* صفحة الإنشاء */
.ed-head{display:flex;align-items:center;gap:14px;padding:24px 0 16px;flex-wrap:wrap}
.ed-head h1{margin:0;font-size:22px;color:var(--ink)}
.split{display:grid;grid-template-columns:minmax(340px,5fr) 7fr;gap:24px;align-items:start;padding-bottom:48px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.grp{border:0;padding:0;margin:0 0 22px}
.grp legend{font-weight:700;color:var(--ink);font-size:15px;padding:0 0 10px;margin-bottom:12px;border-bottom:1px solid var(--line);width:100%;float:right}
.grp .grid{clear:both;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f.wide{grid-column:1/-1}
.f label{display:block;font-size:13.5px;font-weight:600;color:#3b5560;margin-bottom:5px}
.f label em{color:#c0392b;font-style:normal}
.f input[type=text],.f input:not([type]),.f select,.f textarea{width:100%;border:1px solid var(--line);background:#fbfdfd;border-radius:10px;padding:10px 12px;transition:.15s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(33,138,141,.14)}
.f textarea{resize:vertical;min-height:96px}
.f input[data-k][inputmode]{text-align:right}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo.one{grid-template-columns:minmax(0,1fr)}
.imgup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center}
.thumb{aspect-ratio:16/9;border:1.5px dashed var(--soft);border-radius:12px;background:#fbfdfd;display:grid;place-items:center;overflow:hidden;color:#7a8f96;font-size:13px}
.thumb img{width:100%;height:100%;object-fit:contain}
.imgbtns{display:grid;gap:8px}
.trio{display:grid;grid-template-columns:1fr 1.6fr 1.1fr;gap:8px;margin-bottom:8px}
.datebox select{width:100%;min-width:0}
.dayname{margin:0 0 8px;padding:9px 12px;background:var(--tint);border:1px dashed var(--soft);border-radius:10px;color:#6b8088;font-size:14px}
.dayname.on{border-style:solid;color:var(--ink);font-weight:700}
.split>*,.f{min-width:0}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex!important;align-items:center;gap:8px;margin:0!important;font-weight:500!important;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;background:#fbfdfd}
.chk:has(input:checked){border-color:var(--primary);background:var(--tint)}
.chk input{width:17px;height:17px;accent-color:var(--primary)}
.err{display:none;color:#c0392b;font-size:12.5px;margin-top:4px}
.f.bad .err{display:block}
.f.bad input,.f.bad select{border-color:#c0392b;background:#fff7f6}

.preview-panel{position:sticky;top:84px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.zoom{display:none}
.frame{background:#e9eff1;border:1px solid var(--line);border-radius:16px;padding:16px;overflow:auto;max-height:calc(100vh - 170px)}
.mount{position:relative;margin:0 auto}
.mount .card{position:absolute;top:0;left:0;transform-origin:top left;box-shadow:0 6px 24px rgba(8,63,82,.14)}

/* لوحة التوقيع */
.grp .hint{clear:both;margin:0 0 12px;color:#62777f;font-size:13px}
.pads{display:grid;gap:16px;clear:both}
.padhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.padhead strong{color:var(--ink);font-size:14px}
.pad{display:block;width:100%;height:auto;aspect-ratio:640/220;border:1.5px dashed var(--soft);border-radius:12px;cursor:crosshair;touch-action:none;background-color:#fbfdfd;background-image:linear-gradient(transparent calc(100% - 46px),#cfdde1 calc(100% - 46px),#cfdde1 calc(100% - 45px),transparent calc(100% - 45px))}

/* حوار وإشعارات */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,380px)}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;border-inline-start:4px solid #4cc2a5;animation:in .25s;transition:.3s}
.toast.err{border-inline-start-color:#ef6b5b}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.82);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:100;color:var(--ink);font-weight:600}
#busy.show{display:flex}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
dialog{border:0;border-radius:16px;padding:24px;max-width:380px;width:90vw;box-shadow:0 20px 50px rgba(8,63,82,.25);font-family:var(--font);direction:rtl}
dialog::backdrop{background:rgba(8,63,82,.35)}
dialog p{margin:0 0 18px;color:var(--ink);font-weight:500}
dialog div{display:flex;gap:8px;justify-content:flex-start}
.foot strong{color:var(--ink)}
.foot{text-align:center;color:#6b8088;font-size:14px;padding:24px;border-top:1px solid var(--line);background:#fff}

/* =====================================================================
   تصميم البطاقة الرسمية — A4 (794 × 1123)
   ===================================================================== */
.card{width:794px;height:1123px;background:#fff;color:#1c2b33;font-family:var(--font);padding:0 46px 40px;display:flex;flex-direction:column;position:relative;overflow:hidden;line-height:1.5}
.card .bar{display:flex;height:10px;margin:0 -46px 26px}
.card .bar i{flex:1;background:var(--primary)}
.card .bar i:nth-child(1){background:var(--ink);flex:2}
.card .bar i:nth-child(3){background:var(--soft);flex:.6}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.org p{margin:0;font-size:16px;color:#4b6068;font-weight:500}
.org h2{margin:2px 0 0;font-size:27px;color:var(--ink);font-weight:700;line-height:1.3}
.c-head{border-bottom:1px solid #cfdde1;margin-bottom:18px}
.c-head .lg{width:170px;height:96px;display:flex;align-items:center}
.c-head .lg:first-child{justify-content:flex-start}.c-head .lg:last-child{justify-content:flex-end}
.c-head .lg img{max-width:100%;max-height:100%;object-fit:contain}
.org{text-align:center;flex:1}
.c-title{background:var(--ink);color:#fff;text-align:center;font-size:23px;font-weight:700;padding:11px 16px;border-radius:10px;margin-bottom:22px}
.c-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;font-size:15px}
.c-table th,.c-table td{border-bottom:1px solid #b9ccd1;padding:6px 12px;height:var(--rowh,44px);vertical-align:middle;overflow-wrap:anywhere;word-break:break-word}
.c-table tr:last-child th,.c-table tr:last-child td{border-bottom:0}
.c-table th{background:var(--tint);color:var(--ink);font-weight:700;text-align:right;font-size:14px;border-inline-end:1px solid #b9ccd1}
.c-table td:not(:last-child){border-inline-end:1px solid #b9ccd1}
.c-table tr.tall td{height:140px;vertical-align:top;padding-top:10px;line-height:1.75}
.dp{display:inline-block;margin-inline-end:22px;white-space:nowrap}
.dp i{font-style:normal;color:#4b6068;font-weight:600}
.cks{display:flex;flex-wrap:wrap;gap:8px 24px}
.ck{display:inline-flex;align-items:center;gap:8px;font-size:14.5px}
.ck b{width:17px;height:17px;border:1.6px solid var(--ink);border-radius:4px;display:inline-block;position:relative;background:#fff}
.ck.on b{background:var(--primary);border-color:var(--primary)}
.ck.on b:after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.sigs{margin-top:auto;display:grid;gap:14px;padding-top:24px}
.sigs.n2{grid-template-columns:1fr 1fr}.sigs.n3{grid-template-columns:1fr 1fr 1fr}
.sig{border:1px solid #b9ccd1;border-radius:10px;padding:12px 14px;min-height:112px}
.sig h4{margin:0 0 8px;color:var(--ink);font-size:15px;border-bottom:2px solid var(--primary);padding-bottom:4px;display:inline-block}
.sig p{margin:0 0 8px;font-size:14px;display:flex;gap:6px;align-items:flex-end;overflow-wrap:anywhere}
.sig .sg.has .ln{height:54px}
.sig .ln img{position:absolute;bottom:1px;right:4px;height:52px;max-width:96%;object-fit:contain}
.sig .ln{position:relative;flex:1;border-bottom:1px solid #6e8790;min-width:60px;height:18px}
.stage{position:fixed;left:-10000px;top:0;z-index:-1}
#printRoot{display:none}

/* تجاوب */
@media (max-width:980px){
  .split{grid-template-columns:minmax(0,1fr)}
  .preview-panel{position:static}
  .frame{max-height:none}
  .zoom{display:inline-flex}
}
@media (max-width:560px){
  body{font-size:16px}
  .f label{font-size:15.5px}
  .f input[type=text],.f input:not([type]),.f select,.f textarea{font-size:16px;padding:13px 12px}
  .chk{padding:12px;font-size:16px}
  .btn{font-size:15px;padding:12px 16px}
  .grp legend{font-size:17px}
  .ed-head h1{font-size:20px}
  .trio{grid-template-columns:.8fr 1.3fr 1fr}
  .wrap{padding:0 14px}
  .hero{padding:36px 0 24px}.hero h1{font-size:26px}
  .grp .grid,.checks{grid-template-columns:1fr}
  .saved-item{flex-direction:column;align-items:stretch}
  .brand span{display:none}
  .tools .btn{flex:1 1 44%}
  .panel{padding:16px}
}

/* الطباعة: البطاقة فقط على ورقة A4 */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block}
  #printRoot .card{position:static;transform:none;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-after:avoid}
}

/* إصلاح اتساع الصفحة على الجوال (لوحات التوقيع والحقول لا تتجاوز عرض الشاشة) */
.pads{grid-template-columns:minmax(0,1fr)}
.padbox{min-width:0}
.pad{max-width:100%}
.grp .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:560px){
  .grp .grid,.checks{grid-template-columns:minmax(0,1fr)}
  html,body{overflow-x:hidden}
}

/* بطاقة التقرير: شواهد الصور وأسماء بدون توقيع */
.gal-title{margin-top:20px;background:var(--tint);color:var(--ink);font-weight:700;font-size:15px;padding:7px 14px;border:1px solid #b9ccd1;border-radius:10px 10px 0 0;border-bottom:0}
.gallery{display:grid;gap:12px;border:1px solid #b9ccd1;border-radius:0 0 10px 10px;padding:12px}
.shot{border-radius:8px;overflow:hidden;background:#f3f7f8;position:relative;aspect-ratio:16/9}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain} /* الصورة كاملة بمقاسها الأصلي بدون قص */
.shot.empty{border:1.5px dashed #b9ccd1;display:grid;place-items:center;color:#8aa0a7;font-size:14px;background:#fff}
.sig.ns{min-height:0;text-align:center;background:var(--tint);padding:10px 14px}
.sig.ns h4{display:block;border:0;margin:0 0 4px;padding:0;font-size:14px;color:#4b6068}
.sig.ns p{margin:0;justify-content:center;font-size:17px;color:var(--ink)}

/* بطاقة A4 عرضية (landscape:true في card-types.js) */
.card.land{width:1123px;height:794px;padding:0 46px 24px}
.land .bar{margin-bottom:14px}
.land .c-head{padding-bottom:10px;margin-bottom:12px}
.land .c-head .lg{height:70px;width:150px}
.land .org h2{font-size:24px}
.land .c-title{font-size:21px;padding:7px 16px;margin-bottom:12px}
.land .c-table{font-size:14.5px}
.c-table tr.short td{height:auto;padding:8px 12px;line-height:1.7;vertical-align:top}
.land .gal-title{margin-top:18px;padding:5px 14px;font-size:14px}
.land .sigs{padding-top:12px;gap:12px}
.land .sig.ns{padding:6px 12px}
.land .sig.ns p{font-size:16px}
</style>

/* =====================================================================
   التقويم الهجري (أم القرى): يحسب اسم اليوم وعدد أيام كل شهر
   السنوات المسموحة تُضبط من LISTS.hijriYears في config.js
   ===================================================================== */
const HIJRI = (function () {
  const years = LISTS.hijriYears, minY = Math.min.apply(null, years), maxY = Math.max.apply(null, years);
  let fmt = null;
  try { fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { year: 'numeric', month: 'numeric', day: 'numeric', timeZone: 'UTC' }); } catch (e) { fmt = null; }

  // حساب جدولي احتياطي إذا لم يدعم المتصفح تقويم أم القرى
  function tabular(jd) {
    let l = jd - 1948440 + 10632;
    const n = Math.floor((l - 1) / 10631);
    l = l - 10631 * n + 354;
    const j = Math.floor((10985 - l) / 5316) * Math.floor(50 * l / 17719) + Math.floor(l / 5670) * Math.floor(43 * l / 15238);
    l = l - Math.floor((30 - j) / 15) * Math.floor(17719 * j / 50) - Math.floor(j / 16) * Math.floor(15238 * j / 43) + 29;
    const m = Math.floor(24 * l / 709);
    return [30 * n + j - 30, m, l - Math.floor(709 * m / 24)];
  }
  function hijriOf(ms) {
    if (fmt) {
      try {
        const p = fmt.formatToParts(ms), g = t => +(p.find(x => x.type === t) || {}).value;
        const y = g('year'), m = g('month'), d = g('day');
        if (y > 1000 && m >= 1 && m <= 12 && d >= 1 && d <= 30) return [y, m, d];
      } catch (e) { }
    }
    return tabular(Math.floor(ms / 864e5) + 2440588);
  }

  // بناء جدول التواريخ المسموحة مرة واحدة
  const map = {}, maxDays = {};
  const startMs = Date.UTC(Math.floor(minY * 0.970229 + 621.5744) - 1, 0, 1);
  const endMs = Date.UTC(Math.floor((maxY + 1) * 0.970229 + 621.5744) + 2, 0, 1);
  for (let ms = startMs, i = 0; ms < endMs; ms += 864e5, i++) {
    const h = hijriOf(ms);
    if (h[0] < minY || h[0] > maxY || years.indexOf(h[0]) < 0) continue;
    map[h.join('-')] = { wd: new Date(ms).getUTCDay(), ord: i };
    const k = h[0] + '-' + h[1];
    maxDays[k] = Math.max(maxDays[k] || 0, h[2]);
  }
  return {
    // معلومات تاريخ: رقم يوم الأسبوع (0 = الأحد) وترتيبه، أو null إذا كان التاريخ غير صالح
    info: (y, m, d) => map[y + '-' + m + '-' + d] || null,
    // عدد أيام الشهر
    maxDay: (y, m) => maxDays[y + '-' + m] || 30
  };
})();

      <div class="c-title">${esc(t.title)}</div>
      <table class="c-table"><colgroup><col style="width:21%"><col style="width:29%"><col style="width:21%"><col style="width:29%"></colgroup><tbody>${rows}</tbody></table>${gal}
      <div class="sigs n${t.signatures.length}">${sigs}</div></div>`;
  }
  function renderPreview() {
    $('#cardMount').innerHTML = cardHTML(state.type, state.data);
    fitPreview();
  }
  function fitPreview() {
    const frame = $('#frame'), card = $('#cardMount .card'); if (!card) return;
    const w = frame.clientWidth - (state.zoomed ? 0 : 0);
    const [CW, CH] = dims(state.type), s = state.zoomed ? 0.85 : Math.min(1, w / CW);
    card.style.transform = `scale(${s})`;
    $('#cardMount').style.width = CW * s + 'px'; $('#cardMount').style.height = CH * s + 'px';
    $('#zoomBtn').textContent = state.zoomed ? 'ملاءمة العرض' : 'تكبير المعاينة';
  }

  /* ---------- الحفظ ---------- */
  const saveDraft = () => store.set(KEY_DRAFT, { type: state.type, id: state.id, data: state.data });
  function saveCard(silent) {
    const list = getCards(), now = Date.now();
    let rec = list.find(c => c.id === state.id);
    if (rec) { rec.data = JSON.parse(JSON.stringify(state.data)); rec.updated = now; }
    else { state.id = 'c' + now.toString(36) + Math.random().toString(36).slice(2, 6); list.push({ id: state.id, type: state.type, data: JSON.parse(JSON.stringify(state.data)), created: now, updated: now }); }
    if (!store.set(KEY_CARDS, list)) return toast('تعذر الحفظ: مساحة المتصفح ممتلئة أو التخزين معطل', 'err');
    saveDraft(); if (!silent) toast('تم حفظ البطاقة في «البطاقات المحفوظة»');
  }

  /* ---------- التنقل ---------- */
  function openEditor(type, rec) {
    state.type = type; state.id = rec ? rec.id : null; state.zoomed = false;
    $('#home').hidden = true; $('#editor').hidden = false; // يظهر المحرر أولاً ليُقاس عرض المعاينة بشكل صحيح
    const t = CARD_TYPES[type];
    state.data = Object.assign(emptyData(t), rec ? JSON.parse(JSON.stringify(rec.data)) : {});
    $('#edTitle').textContent = t.title;
    buildForm(); fillForm(); renderPreview(); window.scrollTo(0, 0);
  }
  function goHome() { $('#editor').hidden = true; $('#home').hidden = false; renderHome(); window.scrollTo(0, 0); }

  /* ---------- إنشاء صورة البطاقة (PNG) ---------- */
  // يُرسم نسخة بحجمها الحقيقي خارج الشاشة لضمان تطابقها مع المعاينة
  async function renderCanvas() {
    if (typeof html2canvas === 'undefined') throw new Error('lib');
    const stage = document.createElement('div'); stage.className = 'stage'; stage.innerHTML = cardHTML(state.type, state.data);
    document.body.appendChild(stage);
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      await Promise.all($$('img', stage).map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })));
      return await html2canvas(stage.firstElementChild, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false, width: dims(state.type)[0], height: dims(state.type)[1] });
    } finally { stage.remove(); }
  }
  const fileBase = () => {
    const t = CARD_TYPES[state.type], n = String(state.data[t.titleField] || '').replace(/[\\/:*?"<>|\n\r]+/g, ' ').trim().slice(0, 50);
    return t.short + (n ? ' - ' + n : '');
  };
  function download(url, name) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  async function run(label, fn) {
    if (!validate()) return;
    $('#busyMsg').textContent = label; busy(true);
    try { await fn(); } catch (e) { toast(e.message === 'lib' ? 'تعذر تحميل مكتبة التصدير. تأكد من الاتصال بالإنترنت' : 'حدث خطأ أثناء إنشاء الصورة، حاول مجدداً', 'err'); }
    busy(false);
  }
  const exportPNG = () => run('جارٍ إنشاء صورة البطاقة…', async () => {
    const c = await renderCanvas();
    await new Promise(r => c.toBlob(b => { download(URL.createObjectURL(b), fileBase() + '.png'); r(); }, 'image/png'));
    saveCard(true); toast('تم تحميل البطاقة بنجاح');
  });
  const exportPDF = () => run('جارٍ إنشاء ملف PDF…', async () => {
    if (!window.jspdf) throw new Error('lib');
    const c = await renderCanvas(), pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: CARD_TYPES[state.type].landscape ? 'l' : 'p' });
    pdf.addImage(c.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, ...(CARD_TYPES[state.type].landscape ? [297, 210] : [210, 297])); pdf.save(fileBase() + '.pdf');
    saveCard(true); toast('تم تحميل ملف PDF');
  });
  const copyImage = () => run('جارٍ نسخ البطاقة…', async () => {
    if (!navigator.clipboard || !window.ClipboardItem) return toast('متصفحك لا يدعم نسخ الصور، استخدم تحميل PNG', 'err');
    const c = await renderCanvas();
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('تم نسخ البطاقة كصورة');
  });
  function printCard() {
    if (!validate()) return;
    $('#pageStyle').textContent = '@page{size:A4 ' + (CARD_TYPES[state.type].landscape ? 'landscape' : 'portrait') + ';margin:0}'; // اتجاه الورقة
    $('#printRoot').innerHTML = cardHTML(state.type, state.data);
    const clear = () => { $('#printRoot').innerHTML = ''; window.removeEventListener('afterprint', clear); };
    window.addEventListener('afterprint', clear);
    setTimeout(() => window.print(), 60);
  }

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const ds = b.dataset;
    if (ds.today) {
      let ok = false;
      try {
        const p = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(new Date());
        const g = t => +p.find(x => x.type === t).value;
        if (HIJRI.info(g('year'), g('month'), g('day'))) {
          state.data[ds.today] = Object.assign(state.data[ds.today], { y: String(g('year')), m: String(g('month')), d: String(g('day')) });
          fillDate(ds.today); readForm(); updateDayName(ds.today); renderPreview(); saveDraft(); ok = true;
        }
      } catch (x) { }
      if (!ok) toast('تاريخ اليوم خارج السنوات المسموحة، اختر التاريخ من القوائم', 'err');
    }
    else if (ds.rmimg) { state.data[ds.rmimg] = ''; updateThumb(ds.rmimg); renderPreview(); saveDraft(); }
    else if (ds.clrsig != null) { state.data['sig_' + ds.clrsig] = ''; fillPads(); renderPreview(); saveDraft(); }
    else if (ds.new) openEditor(ds.new);
    else if (ds.open) { const r = getCards().find(c => c.id === ds.open); if (r) openEditor(r.type, r); }
    else if (ds.dup) {
      const list = getCards(), r = list.find(c => c.id === ds.dup); if (!r) return;
      const now = Date.now(); list.push({ id: 'c' + now.toString(36) + Math.random().toString(36).slice(2, 6), type: r.type, data: JSON.parse(JSON.stringify(r.data)), created: now, updated: now });
      store.set(KEY_CARDS, list); renderSaved(); toast('تم نسخ البطاقة');
    }
    else if (ds.del) { if (await confirmBox('سيتم حذف هذه البطاقة نهائياً. هل تريد المتابعة؟', 'حذف')) { store.set(KEY_CARDS, getCards().filter(c => c.id !== ds.del)); renderSaved(); toast('تم حذف البطاقة'); } }
  });
  $('#btnHome').onclick = goHome;
  $('#btnDraft').onclick = () => { const d = store.get(KEY_DRAFT); if (d) { openEditor(d.type, { id: d.id, data: d.data }); } };
  $('#btnDownload').onclick = exportPNG;
  $('#btnPdf').onclick = exportPDF;
  $('#btnCopy').onclick = copyImage;
  $('#btnPrint').onclick = printCard;
  $('#btnSave').onclick = () => { if (validate()) saveCard(); };
  $('#btnEdit').onclick = () => { const i = $('#form input, #form select'); $('#form').scrollIntoView({ behavior: 'smooth', block: 'start' }); if (i) setTimeout(() => i.focus({ preventScroll: true }), 350); };
  $('#btnClear').onclick = async () => {
    if (await confirmBox('سيتم مسح جميع البيانات المدخلة في هذه البطاقة. هل تريد المتابعة؟', 'مسح البيانات')) {
      state.data = emptyData(CARD_TYPES[state.type]); fillForm(); $$('.f', $('#form')).forEach(w => { w.classList.remove('bad'); $('.err', w).textContent = ''; });
      renderPreview(); saveDraft(); toast('تم مسح البيانات');
    }
  };
  $('#zoomBtn').onclick = () => { state.zoomed = !state.zoomed; $('#frame').classList.toggle('zoomed', state.zoomed); fitPreview(); };

  // تحديث مباشر للمعاينة أثناء الكتابة
  $('#form').addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.imgin) return;
    if (t.dataset.k && CARD_TYPES[state.type].fields[t.dataset.k].type === 'number') t.value = normDigits(t.value);
    const w = t.closest('.f'); if (w) { w.classList.remove('bad'); $('.err', w).textContent = ''; }
    const k = t.dataset.k, isDate = k && CARD_TYPES[state.type].fields[k].type === 'date';
    if (isDate && (t.dataset.s === 'm' || t.dataset.s === 'y')) refreshDays(k);
    readForm(); if (isDate) updateDayName(k);
    renderPreview(); saveDraft();
  });
  $('#form').addEventListener('change', e => {
    const t = e.target, k = t.dataset.imgin; if (!k) return;
    loadImage(t.files[0]).then(u => { state.data[k] = u; updateThumb(k); renderPreview(); saveDraft(); toast('تمت إضافة الصورة'); })
      .catch(() => toast('تعذر قراءة الصورة، اختر ملف صورة صالحاً', 'err'));
    t.value = '';
  });
  window.addEventListener('resize', fitPreview);
  if (window.ResizeObserver) new ResizeObserver(fitPreview).observe($('#frame'));

  // تهيئة
  $('#heroSub').textContent = SITE_CONFIG.siteSubtitle;
  renderHome();
})();
</script>
</body>
</html>
